<!doctype html>
<html lang="fi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VILPE Sense+ Kuiva katto</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar__inner">
      <a class="brand" href="#/salkku" aria-label="VILPE Sense+ etusivu">
        <img src="assets/vilpe-logo.svg" alt="VILPE" class="brand__logo">
        <span class="brand__product">Sense<b>+</b></span>
      </a>
      <nav class="nav" id="nav">
        <a href="#/salkku" data-view="salkku"></a>
        <a href="#/kohde" data-view="kohde"></a>
        <a href="#/passi" data-view="passi"></a>
        <a href="#/vakuuttaja" data-view="vakuuttaja"></a>
        <a href="#/malli" data-view="malli"></a>
      </nav>
      <div class="locale" id="locale"></div>
      <div class="user" id="user"></div>
    </div>
  </header>

  <main id="view" class="view" tabindex="-1"></main>

  <footer class="footer">
    <div class="footer__inner">
      <span id="footer-a"></span>
      <span id="footer-b"></span>
      <button class="link-button" id="reset"></button>
    </div>
  </footer>

  <div class="modal" id="modal" hidden>
    <div class="modal__backdrop" data-close></div>
    <div class="modal__panel" role="dialog" aria-modal="true" aria-labelledby="modal-title"></div>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="vendor/qrcode.js"></script>
  <script src="data.js"></script>
  <script src="sim.js"></script>
  <script src="i18n.js"></script>
  <script src="charts.js"></script>
  <script src="app.js"></script>
</body>
</html>
